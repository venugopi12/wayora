# Continuous integration for the Wayora monorepo (npm workspaces).
#
# Runs on every push to main and every pull request:
#   install → Prisma engine check → migrations + drift check (PostgreSQL)
#   → lint → format → typecheck → tests (incl. PostgreSQL and Redis integration)
#   → dependency audit → build.
#
# Run the same steps locally: see docs/SETUP.md#continuous-integration.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      # Throwaway database for migrations and the API integration tests. The
      # name must end in _test: the integration suite refuses anything else.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wayora
          POSTGRES_PASSWORD: wayora_ci_only
          POSTGRES_DB: wayora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wayora -d wayora_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      # Search sessions (docs/search.md#search-sessions). The tests use their own
      # key prefix and delete only their keys.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      CI: 'true'
      # Used by the API integration tests (they fail rather than skip when CI is set).
      TEST_DATABASE_URL: postgresql://wayora:wayora_ci_only@localhost:5432/wayora_test
      # Used by the Redis search-session tests (they fail rather than skip when CI is set).
      TEST_REDIS_URL: redis://localhost:6379/15
      # Used by the Prisma CLI (migrate deploy, migrate diff) via database/prisma.config.ts.
      DATABASE_URL: postgresql://wayora:wayora_ci_only@localhost:5432/wayora_test
      # No Prisma telemetry or update checks from CI.
      CHECKPOINT_DISABLE: '1'
      PRISMA_HIDE_UPDATE_MESSAGE: '1'

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Prisma's CLI needs its schema-engine binary for every command, including
      # `prisma generate` (run by `npm ci`). @prisma/engines downloads it once per
      # engine version into ~/.cache/prisma; caching that directory keeps CI
      # reproducible and independent of binaries.prisma.sh after the first run.
      # The key follows the lockfile, i.e. the pinned Prisma version.
      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-engines-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Check the Prisma engine is installed
        run: npm exec --workspace @wayora/database -- prisma --version

      - name: Apply migrations to the test database
        run: npm run db:migrate:deploy

      - name: Check migrations match schema.prisma
        run: npm run db:migrate:check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Known vulnerabilities in what ships (devDependencies excluded). Fails on
      # high or critical advisories; see docs/deployment.md#dependencies.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Production builds refuse to run without an explicit API URL
      # (apps/web/config/security-headers.ts) and site URL (docs/seo.md).
      # CI builds against local ones without CMS content; real releases set
      # the public HTTPS URLs and PRERENDER_CONTENT_URL.
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:4000
          VITE_SITE_URL: http://localhost:4173

  # End-to-end smoke journey (docs/testing.md#end-to-end): the production web
  # build and the API, against throwaway PostgreSQL and Redis, driven by a real
  # Chromium. Demo search and demo payments only: nothing external is called.
  e2e:
    name: End-to-end journey
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wayora
          POSTGRES_PASSWORD: wayora_ci_only
          POSTGRES_DB: wayora_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wayora -d wayora_e2e_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      CI: 'true'
      NODE_ENV: development
      DATABASE_URL: postgresql://wayora:wayora_ci_only@localhost:5432/wayora_e2e_test
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGIN: http://localhost:4173
      WEB_ORIGIN: http://localhost:4173
      API_BASE_URL: http://localhost:4000
      VITE_API_BASE_URL: http://localhost:4000
      VITE_SITE_URL: http://localhost:4173
      CHECKPOINT_DISABLE: '1'
      PRISMA_HIDE_UPDATE_MESSAGE: '1'

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-engines-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx --workspace @wayora/web playwright install --with-deps chromium

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Build
        run: npm run build

      - name: Start the API and the web build
        run: |
          (node apps/api/dist/server.js > api.log 2>&1 &)
          (cd apps/web && npx vite preview --port 4173 --strictPort > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/api/v1/health/ready > /dev/null \
              && curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 2
          done
          echo "API or web did not start"; cat api.log web.log; exit 1

      - name: Run the journey
        run: npm run test:e2e -w @wayora/web

      - name: Keep screenshots and logs of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            apps/web/e2e-results/
            api.log
            web.log
          retention-days: 7
